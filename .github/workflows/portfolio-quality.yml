name: Portfolio quality checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Build, unit tests, static checks and browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out site
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=moderate

      - name: Syntax, build, static checks and visit-endpoint tests
        run: npm run check

      - name: Install Chromium test tools
        run: |
          python -m pip install 'playwright>=1.55,<2'
          python -m playwright install --with-deps chromium

      - name: Desktop, tablet and mobile browser tests (all external calls mocked)
        run: python scripts/browser_smoke.py

      - name: Save review screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-review-screenshots
          path: test-screenshots/*.png
          if-no-files-found: ignore
