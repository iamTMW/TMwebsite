<a class="skip" href="#main">Skip to content</a>

<header class="topbar">
  <a class="mark" href="/" aria-label="Taha Mohyuddin, home">
    <span class="mark-i" aria-hidden="true">TM</span>
    <span class="mark-name">Taha Mohyuddin</span>
  </a>
  <nav class="topnav" aria-label="Primary">
      {{nav}}
  </nav>
  <button class="theme-btn" type="button" data-theme-toggle aria-label="Switch colour theme" title="Switch colour theme">
    <svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    <svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 14.2A8.5 8.5 0 0 1 9.8 3.5a8.5 8.5 0 1 0 10.7 10.7Z"/></svg>
  </button>
  <a class="btn btn-ghost btn-sm topcta" href="/resume" target="_blank" rel="noopener">Resume</a>
</header>

<nav class="tabbar" aria-label="Sections">
  {{tabs}}
  <button type="button" data-sheet-open aria-haspopup="dialog" aria-controls="sheet"><span class="pip" aria-hidden="true"></span>More</button>
</nav>

<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-hidden="true" inert aria-label="All pages">
  <div class="sheet-panel">
    <div class="sheet-grab" aria-hidden="true"></div>
    {{sheet}}
    <a href="/resume" target="_blank" rel="noopener">Resume <small>PDF</small></a>
    <div class="sheet-actions">
      <button class="btn btn-ghost" type="button" data-theme-toggle>Switch theme</button>
      <button class="btn btn-ghost" type="button" data-sheet-close>Close</button>
    </div>
  </div>
</div>
